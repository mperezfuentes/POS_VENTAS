<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Point · Rancagua y Curicó</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#6b7686;--bd:#e3e7ec;--ac:#1f3864;--ok:#1e8e3e;--bad:#c5221f;--wa:#b06000;--bar:#3b6fd4}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--tx:#e8edf3;--mu:#97a3b3;--bd:#2a3442;--ac:#8fb0f0;--ok:#5bd17a;--bad:#ff8a80;--wa:#ffb74d;--bar:#6c9bf2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px;max-width:1000px;margin-inline:auto}
h1{font-size:18px;margin:0;color:var(--ac)}h2{font-size:14px;margin:0 0 8px}h3{font-size:12px;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sub{color:var(--mu);font-size:12px}
button,select{font:inherit;border-radius:8px;border:1px solid var(--bd)}
button{background:var(--ac);color:var(--bg);border:0;padding:8px 12px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
select{background:var(--card);color:var(--tx);padding:7px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.banner{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px}.err{background:#fde8e8;color:#8a1c1c}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.v{font-size:26px;font-weight:700;margin-top:2px}.s{font-size:12px;color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.pb{background:var(--bd);border-radius:6px;height:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--bar)}
.pb.big{height:14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row b{width:150px;font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pb{flex:1}.row span{width:70px;text-align:right;font-weight:600;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:14px 0}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .nm{font-weight:700}summary .nm:before{content:"▸ ";color:var(--mu)}details[open] summary .nm:before{content:"▾ "}
summary .pb{grid-column:1/-1}
.body{padding:0 12px 12px;border-top:1px solid var(--bd)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.mini div{background:var(--bg);border-radius:8px;padding:8px}.mini .v{font-size:18px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:300px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13px}
th:first-child,td:first-child{text-align:left}th{font-size:11px;color:var(--mu);text-transform:uppercase}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--mu)}
.dot.v{background:var(--ok)}.dot.a{background:#f2b01e}.dot.r{background:var(--bad)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.tag.v{color:var(--ok)}.tag.a{color:var(--wa)}.tag.r{color:var(--bad)}.tag.g{color:var(--mu)}
.sr{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd)}.sr:last-of-type{border-bottom:0}
.sr .dot{width:20px;height:20px;margin:2px 0 0;flex:none}.sr .ar{font-size:16px;font-weight:700}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 6px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#rep{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:12px;z-index:9}
#rep .sheet{background:var(--card);color:var(--tx);max-width:760px;margin:0 auto;border-radius:12px;padding:16px}
@media print{body>*:not(#rep){display:none!important}#rep{position:static;background:none;padding:0;display:block!important}#rep .sheet{box-shadow:none;max-width:none}.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="top">
  <div><h1>KPI Ventas Point · Rancagua y Curicó</h1><div class="sub" id="upd">Cargando…</div></div>
  <button id="btn">Actualizar</button>
</div>
<div id="msg"></div>
<div class="filters">
  <label class="sub">Mes <select id="fMes"></select></label>
  <label class="sub">Zona <select id="fZona"></select></label>
</div>
<div class="card" id="sem" style="margin-bottom:14px"></div>
<div class="kpis" id="kpis"></div>
<div class="grid2">
  <div class="card"><h2>Embudo de conversión</h2><div id="funnel"></div></div>
  <div class="card"><h2>Conversión por rubro</h2><div class="wrap"><table id="rubros"></table></div></div>
</div>
<h2>Vendedores <span class="sub">(toca para desplegar)</span></h2>
<div id="vends"></div>
<div id="rep"><div class="sheet" id="repBody"></div></div>

<script>
/* ===== CONFIGURACIÓN: edita solo este bloque ===== */
const CONFIG = {
  // Link CSV de la hoja "Publico" (Archivo > Compartir > Publicar en la Web > hoja Publico > CSV)
  CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRAGq8wHosK6QMeHEw7SXWY9RFSPUFQtPh-O27Y2RKOuAnz8638DRtPZ4899kpZf-Tx1C5nGqgn3xbM/pubhtml",
  vendedores: ["Vendedor 1","Vendedor 2","Vendedor 3","Vendedor 4"],
  metaAnual: 378,            // = Supuestos!B6 del Sheet
  rampa: [0.5, 0.75, 1],     // mes 1, mes 2, mes 3 en adelante
  inicioPrograma: "2026-11-01",
  metaActivacion: 0.8,
  reunionesDia: 6,           // meta diaria por defecto; si la hoja trae 'Metas por vendedor', se usa la de cada uno
  semaforo: {verde:0.9, amarillo:0.7, minDias:3}, // ritmo de ventas vs lo esperado a la fecha
  refrescoMin: 5
};
/* ================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (x*100).toFixed(1).replace('.',',') + '%';
const f1 = x => x.toFixed(1).replace('.',',');
const num = x => Number(String(x).replace(',', '.')) || 0;
const p2 = n => String(n).padStart(2,'0');
const mkey = d => d.getFullYear()+'-'+p2(d.getMonth()+1);
const dkey = d => mkey(d)+'-'+p2(d.getDate());
const dmy = d => p2(d.getDate())+'/'+p2(d.getMonth()+1);
const day0 = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const cls = (v,lo) => v>=1?'ok':(v<lo?'bad':'wa');
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mlabel = k => { const [y,m]=k.split('-'); return MESES[+m-1]+' '+y };

let ALL=[], DEMO=false, OPEN=new Set(), SEM={}, METAS={};
/* ---------- metas por vendedor (hoja 'Metas por vendedor' vía Publico, columnas K:M) ---------- */
function toMetas(rows){ const m={};
  rows.slice(1).filter(r=>r[10]&&r[10].trim()).forEach(r=>{ m[r[10].trim()]={peso:(r[11]===''||r[11]==null)?1:num(r[11]), rd:num(r[12])||CONFIG.reunionesDia} });
  return m }
const peso = v => (METAS[v]&&isFinite(METAS[v].peso))?METAS[v].peso:1;
const rd = v => (METAS[v]&&METAS[v].rd>0)?METAS[v].rd:CONFIG.reunionesDia;
function share(v){ const vs=vendList(), tot=vs.reduce((s,x)=>s+peso(x),0); return tot?peso(v)/tot:1/vs.length }

/* ---------- datos ---------- */
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!='\r') c+=ch;
  }
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
function parseDate(s){
  s=String(s||'').trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return new Date(+m[1],+m[2]-1,+m[3]);
  if(m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/)) return new Date(+m[3],+m[2]-1,+m[1]); // d/m/a (Chile)
  return null;
}
const kind = s => { s=(s||'').toLowerCase(); return s.includes('vendi')?'venta':s.includes('seguim')?'seg':s.includes('perdi')?'perdido':'otro' };
const yes = s => /^s[ií]/i.test((s||'').trim());
// Hoja Publico: Fecha, Vendedor, Zona, Rubro, Tipo, Resultado, ProxSeguimiento, PrimerCobro, SeguimientoCerrado
function toRecords(rows){
  return rows.slice(1).filter(r=>r[1]&&parseDate(r[0])).map(r=>({
    f:parseDate(r[0]), vend:r[1].trim(), zona:(r[2]||'').trim()||'Sin zona', rub:(r[3]||'').trim()||'Sin rubro',
    tipo:(r[4]||'').trim(), res:kind(r[5]), prox:parseDate(r[6]), cobro:yes(r[7]), cerr:yes(r[8])
  }));
}
function demoData(){
  const out=[], zs=["Rancagua Centro","Rancagua Mall","Rancagua Poblaciones/Ferias","Curicó"], rs=["Almacén / Minimarket","Gastronomía","Belleza / Estética","Feria / Ambulante","Salud"];
  const hoy=day0(new Date()); let n=0;
  CONFIG.vendedores.forEach((v,i)=>{ for(let d=0;d<26;d++){
    const f=new Date(hoy); f.setDate(f.getDate()-d); if(f.getDay()==0||f.getDay()==6) continue;
    const cnt = d==0 ? 2+i : 4+((i+d)%4);
    for(let j=0;j<cnt;j++){ n++;
      const x=(n*37+i*11+d*13)%100, pv=[7,4,1,11][i%4], res = x<pv?'venta':x<pv+35?'seg':'perdido';
      out.push({f,vend:v,zona:zs[(i+j)%4],rub:rs[(n+j)%5],tipo:(n%3==0?'Seguimiento':'Primera reunión'),res,
        prox: res=='seg'? new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()+((n%9)-3)) : null,
        cobro: res=='venta' && n%4!=0, cerr:false});
    }}});
  return out;
}

/* ---------- metas ---------- */
const prog0 = () => parseDate(CONFIG.inicioPrograma);
function idxMes(d){ const i=prog0(); return (d.getFullYear()-i.getFullYear())*12+d.getMonth()-i.getMonth()+1 }
const rampaDe = k => CONFIG.rampa[k-1] ?? CONFIG.rampa[CONFIG.rampa.length-1];
const metaMes = k => k<1?0:(CONFIG.metaAnual/12*rampaDe(Math.min(k,12)));
function metaAcum(k){ let t=0; for(let i=1;i<=Math.min(Math.max(k,0),12);i++) t+=metaMes(i); return t }

/* ---------- cálculos ---------- */
function stats(a){
  const reu=a.length, ven=a.filter(r=>r.res=='venta').length, seg=a.filter(r=>r.res=='seg').length,
        per=a.filter(r=>r.res=='perdido').length, act=a.filter(r=>r.res=='venta'&&r.cobro).length,
        prim=a.filter(r=>/prim/i.test(r.tipo)).length;
  return {reu,ven,seg,per,act,prim,segm:reu-prim,conv:reu?ven/reu:0,actp:ven?act/ven:0};
}
function pend(a){
  const h=day0(new Date()), p=a.filter(r=>r.res=='seg'&&!r.cerr);
  const dd=r=>r.prox?Math.round((day0(r.prox)-h)/864e5):null;
  return {tot:p.length, atras:p.filter(r=>dd(r)!==null&&dd(r)<0).length, hoy:p.filter(r=>dd(r)===0).length,
          prox7:p.filter(r=>dd(r)>0&&dd(r)<=7).length, sinf:p.filter(r=>dd(r)===null).length};
}
function ultimos7(a){
  const out=[], h=day0(new Date());
  for(let i=0;i<7;i++){ const d=new Date(h); d.setDate(h.getDate()-i);
    const x=a.filter(r=>dkey(r.f)==dkey(d)); out.push({d,reu:x.length,ven:x.filter(r=>r.res=='venta').length}) }
  return out;
}
function filtro(){
  const mes=$('fMes').value, zona=$('fZona').value;
  return {mes,zona,rows:ALL.filter(r=>(mes=='todos'||mkey(r.f)==mes)&&(zona=='todas'||r.zona==zona))};
}
function metaFiltro(F,nv){ // meta del equipo según el filtro (null si no aplica)
  if(F.zona!='todas') return null;
  if(F.mes=='todos') return metaAcum(idxMes(new Date()));
  const [y,m]=F.mes.split('-'); return metaMes(idxMes(new Date(+y,+m-1,1)));
}

/* ---------- semáforo ---------- */
function habiles(a,b){ let n=0; for(const d=day0(a); d<=b; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w&&w<6) n++ } return n }
const semKey = () => { const m=$('fMes').value; return m&&m!='todos'?m:mkey(new Date()) };
const SEMTXT={v:'En línea',a:'En riesgo',r:'Fuera de meta',g:'Sin evaluar'};
function semaforo(v,nv){
  const S=CONFIG.semaforo, now=day0(new Date()), key=semKey(), [y,m]=key.split('-').map(Number);
  const ini=new Date(y,m-1,1), fin=new Date(y,m,0), k=idxMes(ini), metaV=metaMes(k)*share(v);
  if(k<1||metaV<=0) return {c:'g',t:'Sin meta: el programa inicia el '+prog0().toLocaleDateString('es-CL'),d:'',ar:''};
  if(now<ini) return {c:'g',t:'Mes futuro',d:'',ar:''};
  const t=now>fin?fin:now, hTot=habiles(ini,fin), hTr=habiles(ini,t), hRest=Math.max(0,hTot-hTr);
  const mine=ALL.filter(r=>r.vend==v), ven=mine.filter(r=>mkey(r.f)==key&&r.res=='venta').length;
  const esp=metaV*hTr/hTot, ritmo=esp?ven/esp:1;
  const d7=new Date(t); d7.setDate(t.getDate()-6);
  const rate=mine.filter(r=>r.f>=d7&&r.f<=t).length/Math.max(1,habiles(d7,t));   // reuniones por día hábil (últ. 7 días)
  const d30=new Date(t); d30.setDate(t.getDate()-29);
  const mv=mine.filter(r=>r.f>=d30&&r.f<=t); let conv;
  if(mv.length>=10) conv=mv.filter(r=>r.res=='venta').length/mv.length;
  else { const tm=ALL.filter(r=>r.f>=d30&&r.f<=t); conv=tm.length>=10?tm.filter(r=>r.res=='venta').length/tm.length:CONFIG.metaAnual/12*share(v)/(rd(v)*20) }
  const proy=ven+rate*hRest*conv, pr=proy/metaV;
  let c=ritmo>=S.verde?'v':ritmo>=S.amarillo?'a':'r', tx, ar='→';
  if(hRest===0){ tx=pr>=1?'Cerró en meta':'Cerró bajo la meta'; ar=''; if(pr>=1) c='v' }
  else if(mkey(t)==key && hTr<S.minDias) { c='g'; tx='Pocos días para evaluar'; ar='' }
  else if(c=='v'){ tx=pr>=1?'Llegaría a la meta':(pr>=.9?'Cierre ajustado':'Puede caer'); if(pr<.9) ar='↘' }
  else { tx=pr>=1?'Puede remontar y cumplir':(pr>=.9?'Puede remontar (ajustado)':(c=='a'?'Difícil llegar a la meta':'Difícil remontar')); if(pr>=.9) ar='↗' }
  const act=rate/rd(v)<.7&&hRest>0?' · Actividad baja':'';
  return {c,t:tx+act,ar,d:`Ventas ${ven} · esperado a hoy ${f1(esp)} · proyección ${f1(proy)} de ${f1(metaV)} · ${f1(rate)} reun./día`};
}
function renderSem(vends){
  const nv=vends.length, L=vends.map(v=>({v,...semaforo(v,nv)})); SEM={}; L.forEach(x=>SEM[x.v]=x);
  const ord={r:0,a:1,v:2,g:3}, cnt=c=>L.filter(x=>x.c==c).length;
  L.sort((a,b)=>ord[a.c]-ord[b.c]);
  const S=CONFIG.semaforo;
  $('sem').innerHTML=`<h2>Semáforo de metas · ${mlabel(semKey())}</h2>
   <div class="sum"><span><i class="dot v"></i>${cnt('v')} en línea</span><span><i class="dot a"></i>${cnt('a')} en riesgo</span><span><i class="dot r"></i>${cnt('r')} fuera de meta</span></div>`+
   L.map(x=>`<div class="sr"><i class="dot ${x.c}"></i><div><b>${esc(x.v)}</b> <span class="tag ${x.c}">${SEMTXT[x.c]}</span> <span class="ar ${x.ar=='↗'?'ok':x.ar=='↘'?'bad':''}">${x.ar}</span>
     <div>${esc(x.t)}</div><div class="s">${esc(x.d)}</div></div></div>`).join('')+
   `<details style="margin:8px 0 0;border:0"><summary style="padding:4px 0;display:block" class="s">¿Cómo se calcula?</summary><div class="s">
     <b>Color</b>: ventas del mes ÷ ventas esperadas a hoy (meta del mes repartida por días hábiles). Verde ≥ ${S.verde*100}%, amarillo ≥ ${S.amarillo*100}%, rojo por debajo.
     <b>Flecha</b>: proyección al cierre = ventas actuales + reuniones diarias de los últimos 7 días × días hábiles restantes × conversión de los últimos 30 días.
     ↗ si está en amarillo/rojo pero la proyección llega a ≥ 90% de la meta (puede remontar); ↘ si está en verde pero la proyección queda bajo 90% (puede caer).
     Gris: sin meta, mes futuro o menos de ${S.minDias} días hábiles de datos. No depende del filtro de zona.</div></details>`;
}

/* ---------- render ---------- */
function setFilters(){
  const ms=[...new Set(ALL.map(r=>mkey(r.f)))].sort().reverse(), zs=[...new Set(ALL.map(r=>r.zona))].sort();
  const pm=$('fMes').value, pz=$('fZona').value, cur=mkey(new Date());
  $('fMes').innerHTML='<option value="todos">Todos</option>'+ms.map(m=>`<option value="${m}">${mlabel(m)}</option>`).join('');
  $('fZona').innerHTML='<option value="todas">Todas</option>'+zs.map(z=>`<option>${esc(z)}</option>`).join('');
  $('fMes').value = pm && (pm=='todos'||ms.includes(pm)) ? pm : (ms.includes(cur)?cur:'todos');
  if(pz && (pz=='todas'||zs.includes(pz))) $('fZona').value=pz;
}
function vendList(){ return [...new Set([...CONFIG.vendedores,...ALL.map(r=>r.vend)])] }

function render(){
  const F=filtro(), S=stats(F.rows), vends=vendList(), nv=vends.length;
  renderSem(vends);
  const mT=metaFiltro(F,nv);
  const hoyRows=ALL.filter(r=>dkey(r.f)==dkey(new Date())&&(F.zona=='todas'||r.zona==F.zona)), hoy=hoyRows.length, mHoy=vends.reduce((s,x)=>s+rd(x),0);
  const av=mT?S.ven/mT:null, mc=CONFIG.metaActivacion, P=pend(ALL);
  $('kpis').innerHTML=`
   <div class="card"><div class="k">Reuniones hoy</div><div class="v ${cls(hoy/mHoy,.5)}">${hoy}<span class="s"> / ${mHoy}</span></div><div class="s">Meta diaria del equipo</div></div>
   <div class="card"><div class="k">Ventas</div><div class="v">${S.ven}</div><div class="s">${mT===null?'Meta no aplica con filtro de zona':'Meta: '+f1(mT)}</div></div>
   <div class="card"><div class="k">Avance vs meta</div><div class="v ${av===null?'':cls(av,.8)}">${av===null?'–':pct(av)}</div><div class="s">Meta anual: ${CONFIG.metaAnual}</div></div>
   <div class="card"><div class="k">Reunión → Venta</div><div class="v">${pct(S.conv)}</div><div class="s">${S.reu} reuniones</div></div>
   <div class="card"><div class="k">Activación</div><div class="v ${S.ven?(S.actp>=mc?'ok':'bad'):''}">${S.ven?pct(S.actp):'–'}</div><div class="s">Meta: ${pct(mc)}</div></div>
   <div class="card"><div class="k">Seguimientos pend.</div><div class="v ${P.atras?'bad':''}">${P.tot}</div><div class="s">${P.atras} atrasados · ${P.hoy} hoy</div></div>`;

  const fn=[['Reuniones',S.reu],['Seguimiento agendado',S.seg],['Ventas',S.ven],['Con primer cobro',S.act]], mx=Math.max(1,S.reu);
  $('funnel').innerHTML=fn.map(([k,v],i)=>`<div class="row"><b>${k}</b><div class="pb big"><i style="width:${v/mx*100}%"></i></div><span>${v}${i?` · ${pct(fn[i-1][1]?v/fn[i-1][1]:0)}`:''}</span></div>`).join('')+
    `<div class="s">% = conversión respecto al paso anterior · Perdidos: ${S.per}</div>`;

  const rb={}; F.rows.forEach(r=>(rb[r.rub]=rb[r.rub]||[]).push(r));
  $('rubros').innerHTML='<tr><th>Rubro</th><th>Reun.</th><th>Ventas</th><th>Conv.</th></tr>'+
    Object.entries(rb).map(([k,a])=>[k,stats(a)]).sort((a,b)=>b[1].conv-a[1].conv).map(([k,s])=>`<tr><td>${esc(k)}</td><td>${s.reu}</td><td>${s.ven}</td><td>${pct(s.conv)}</td></tr>`).join('')||'<tr><td>Sin datos</td></tr>';

  $('vends').innerHTML=vends.map(v=>{
    const a=F.rows.filter(r=>r.vend==v), s=stats(a), all=ALL.filter(r=>r.vend==v), p=pend(all), u=ultimos7(all);
    const h=all.filter(r=>dkey(r.f)==dkey(new Date())).length, ah=h/rd(v), mVv=mT===null?null:mT*share(v), avv=mVv?s.ven/mVv:null;
    return `<details data-v="${esc(v)}" ${OPEN.has(v)?'open':''}><summary>
      <span class="nm"><i class="dot ${SEM[v].c}"></i>${esc(v)} <span class="tag ${SEM[v].c}">${SEMTXT[SEM[v].c]}</span> <b>${SEM[v].ar}</b></span><span class="${cls(ah,.5)}"><b>${h}</b> / ${rd(v)} reuniones hoy</span>
      <div class="pb"><i style="width:${Math.min(100,ah*100)}%"></i></div></summary>
      <div class="body">
       <div class="mini">
        <div><div class="k">Reuniones</div><div class="v">${s.reu}</div></div>
        <div><div class="k">Ventas</div><div class="v">${s.ven}</div></div>
        <div><div class="k">Conversión</div><div class="v">${pct(s.conv)}</div></div>
        <div><div class="k">Activación</div><div class="v ${s.ven?(s.actp>=mc?'ok':'bad'):''}">${s.ven?pct(s.actp):'–'}</div></div>
        <div><div class="k">Avance meta</div><div class="v ${avv===null?'':cls(avv,.8)}">${avv===null?'–':pct(avv)}</div><div class="s">${mVv===null?'':'Meta '+f1(mVv)}</div></div>
       </div>
       <h3>Seguimientos pendientes</h3>
       <div class="mini">
        <div><div class="k">Atrasados</div><div class="v ${p.atras?'bad':''}">${p.atras}</div></div>
        <div><div class="k">Hoy</div><div class="v ${p.hoy?'wa':''}">${p.hoy}</div></div>
        <div><div class="k">Próx. 7 días</div><div class="v">${p.prox7}</div></div>
        <div><div class="k">Sin fecha</div><div class="v">${p.sinf}</div></div>
       </div>
       <h3>Metas diarias · últimos 7 días</h3>
       <div class="wrap"><table><tr><th>Día</th><th>Reuniones</th><th>Meta</th><th>Ventas</th></tr>${
        u.map(x=>`<tr><td>${dmy(x.d)}</td><td class="${x.reu>=rd(v)?'ok':(x.d.getDay()%6?'bad':'')}">${x.reu}</td><td>${rd(v)}</td><td>${x.ven}</td></tr>`).join('')}</table></div>
       <div class="acts"><button class="rep" data-v="${esc(v)}">Generar informe</button></div>
      </div></details>`}).join('');
  document.querySelectorAll('#vends details').forEach(d=>d.addEventListener('toggle',()=>d.open?OPEN.add(d.dataset.v):OPEN.delete(d.dataset.v)));
  document.querySelectorAll('button.rep').forEach(b=>b.onclick=()=>informe(b.dataset.v));
  $('upd').textContent='Actualizado: '+new Date().toLocaleString('es-CL')+(DEMO?' · MODO DEMO':'');
}

/* ---------- informe por vendedor ---------- */
function informe(v){
  const F=filtro(), a=F.rows.filter(r=>r.vend==v), s=stats(a), all=ALL.filter(r=>r.vend==v), p=pend(all), u=ultimos7(all);
  const nv=vendList().length, mT=metaFiltro(F,nv), mV=mT===null?null:mT*share(v);
  const per=(F.mes=='todos'?'Todos los meses':mlabel(F.mes))+' · '+(F.zona=='todas'?'Todas las zonas':F.zona);
  const rb={}; a.forEach(r=>(rb[r.rub]=rb[r.rub]||[]).push(r));
  const rr=Object.entries(rb).map(([k,x])=>[k,stats(x)]).sort((x,y)=>y[1].conv-x[1].conv);
  const txt=`INFORME ${v}\n${per}\nSemáforo: ${SEMTXT[SEM[v].c]} – ${SEM[v].t}\nReuniones: ${s.reu} (primeras ${s.prim}, seguimientos ${s.segm})\nVentas: ${s.ven} · Conversión: ${pct(s.conv)}\nActivación: ${s.ven?pct(s.actp):'–'} (meta ${pct(CONFIG.metaActivacion)})\n`+
    (mV!==null?`Meta: ${f1(mV)} · Avance: ${pct(mV?s.ven/mV:0)}\n`:'')+
    `Seguimientos pendientes: ${p.tot} (${p.atras} atrasados, ${p.hoy} hoy, ${p.prox7} próx. 7 días)\nPerdidos: ${s.per}`;
  $('repBody').innerHTML=`
   <h1>Informe de ${esc(v)}</h1><div class="sub">${esc(per)} · generado ${new Date().toLocaleDateString('es-CL')}</div>
   <p><i class="dot ${SEM[v].c}"></i><b>${SEMTXT[SEM[v].c]}</b> · ${esc(SEM[v].t)} <span class="s">${esc(SEM[v].d)}</span></p>
   <div class="mini">
     <div><div class="k">Reuniones</div><div class="v">${s.reu}</div></div><div><div class="k">Ventas</div><div class="v">${s.ven}</div></div>
     <div><div class="k">Conversión</div><div class="v">${pct(s.conv)}</div></div><div><div class="k">Activación</div><div class="v">${s.ven?pct(s.actp):'–'}</div></div>
     <div><div class="k">Perdidos</div><div class="v">${s.per}</div></div><div><div class="k">Avance meta</div><div class="v">${mV?pct(s.ven/mV):'–'}</div></div></div>
   <h3>Seguimientos pendientes</h3>
   <p>${p.tot} en total: <b>${p.atras}</b> atrasados, <b>${p.hoy}</b> para hoy, <b>${p.prox7}</b> en los próximos 7 días, ${p.sinf} sin fecha.</p>
   <h3>Conversión por rubro</h3>
   <div class="wrap"><table><tr><th>Rubro</th><th>Reuniones</th><th>Ventas</th><th>Conversión</th></tr>${rr.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.reu}</td><td>${x.ven}</td><td>${pct(x.conv)}</td></tr>`).join('')||'<tr><td>Sin datos</td></tr>'}</table></div>
   <h3>Meta diaria (${rd(v)} reuniones) · últimos 7 días</h3>
   <div class="wrap"><table><tr><th>Día</th><th>Reuniones</th><th>Ventas</th></tr>${u.map(x=>`<tr><td>${dmy(x.d)}</td><td>${x.reu}</td><td>${x.ven}</td></tr>`).join('')}</table></div>
   <div class="acts noprint"><button id="bPrint">Imprimir / PDF</button><button class="ghost" id="bCopy">Copiar resumen</button><button class="ghost" id="bCsv">Descargar CSV</button><button class="ghost" id="bClose">Cerrar</button></div>`;
  $('rep').style.display='block';
  $('bClose').onclick=()=>$('rep').style.display='none';
  $('bPrint').onclick=()=>window.print();
  $('bCopy').onclick=async e=>{ try{await navigator.clipboard.writeText(txt);e.target.textContent='¡Copiado!'}catch(_){prompt('Copia el resumen:',txt)} };
  $('bCsv').onclick=()=>{
    const head='fecha,zona,rubro,tipo,resultado,proximo_seguimiento,primer_cobro\n';
    const body=a.map(r=>[dkey(r.f),r.zona,r.rub,r.tipo,r.res,r.prox?dkey(r.prox):'',r.cobro?'Sí':''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const l=document.createElement('a'); l.href=URL.createObjectURL(new Blob(['\ufeff'+head+body],{type:'text/csv'})); l.download='informe_'+v.replace(/\W+/g,'_')+'.csv'; l.click();
  };
}

/* ---------- carga ---------- */
async function load(){
  $('msg').innerHTML='';
  if(!CONFIG.CSV_URL){ DEMO=true; CONFIG.inicioPrograma=mkey(new Date())+'-01'; ALL=demoData(); METAS={'Vendedor 1':{peso:1,rd:6},'Vendedor 2':{peso:1,rd:6},'Vendedor 3':{peso:.8,rd:5},'Vendedor 4':{peso:1.2,rd:7}}; $('msg').innerHTML='<div class="banner">Modo demo: pega el CSV_URL en CONFIG para ver datos reales.</div>' }
  else try{
    DEMO=false;
    const res=await fetch(CONFIG.CSV_URL+(CONFIG.CSV_URL.includes('?')?'&':'?')+'t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=parseCSV(await res.text()); ALL=toRecords(rows); METAS=toMetas(rows);
  }catch(e){ ALL=[]; METAS={}; $('msg').innerHTML=`<div class="banner err">No se pudo leer el Sheet (${esc(e.message)}). Revisa que la hoja Publico esté publicada como CSV.</div>` }
  setFilters(); render();
}
$('btn').onclick=load; $('fMes').onchange=render; $('fZona').onchange=render;
load(); setInterval(load,CONFIG.refrescoMin*60000);
</script>
</body>
