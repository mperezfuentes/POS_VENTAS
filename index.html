 const R=62,C=2*Math.PI*R;let off=0,segs='';
 if(total>0)parts.forEach((p,i)=>{const len=C*p.v/total;segs+=`<circle cx="88" cy="88" r="${R}" fill="none" stroke="${p.c}" stroke-width="24" stroke-dasharray="${Math.max(0,len-1.5).toFixed(2)} ${(C-Math.max(0,len-1.5)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 88 88)"><title>${esc(p.name)}: ${fmt(p.v)}</title></circle>`;off+=len});
 else segs=`<circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--sx-line2)" stroke-width="24"/>`;
 return `<svg viewBox="0 0 176 176" role="img" aria-label="Ventas por vendedor"><circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--sx-line2)" stroke-width="24"/>${segs}<text class="big" x="88" y="90" text-anchor="middle">${fmt(total)}</text><text class="lab" x="88" y="108" text-anchor="middle">ventas</text></svg>`;
}
function ensure(){
 if($('sxCharts'))return true;const host=document.querySelector('#page-dashboard .metrics');if(!host)return false;
 const w=document.createElement('div');w.id='sxCharts';w.className='sx-charts';
 w.innerHTML=`<article class="card"><div class="sx-head"><div><h2>Ventas del período</h2><div class="sx-sub" id="sxAreaSub"></div></div><div class="sx-seg" id="sxSeg"><button data-m="acum" class="on">Acumulado</button><button data-m="dia">Diario</button></div></div><div class="sx-legend"><span><i style="background:#3b82f6"></i>Ventas reales</span><span><i style="background:#12b76a"></i>Meta (ritmo lineal)</span></div><div id="sxArea"></div><div class="sx-empty" id="sxAreaEmpty"></div></article><article class="card"><div class="sx-head"><div><h2>Ventas por vendedor</h2><div class="sx-sub" id="sxDonutSub"></div></div></div><div class="sx-donut"><div id="sxDonut"></div><div class="sx-leg" id="sxLeg"></div></div></article>`;
 host.insertAdjacentElement('afterend',w);
 $('sxSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('sxSeg').children].forEach(x=>x.classList.toggle('on',x===b));draw()});
 return true;
}
function draw(){
 if(!ensure())return;const db=getDb(),ym=($('dashboardPeriod')||{}).value||curYm(),S=build(db,ym),goal=numEs(($('fGoal')||{}).textContent);
 $('sxArea').innerHTML=areaSvg(S,goal);
 const total=S.per.reduce((a,b)=>a+b,0);
 $('sxAreaSub').textContent=`${ym} · meta ${fmt(goal)} · ventas ${fmt(total)}`;
 $('sxAreaEmpty').textContent=total===0?'Todavía no hay ventas registradas en este período.':'';
 const names={};(db.sellers||[]).forEach(s=>names[s.id]=s.name);
 let parts=Object.entries(S.bySeller).filter(([,v])=>v>0).map(([id,v])=>({name:names[id]||'Vendedor eliminado',v})).sort((a,b)=>b.v-a.v);
 if(parts.length>5){const rest=parts.slice(5).reduce((a,p)=>a+p.v,0);parts=parts.slice(0,5);parts.push({name:'Otros',v:rest})}
 parts.forEach((p,i)=>p.c=PAL[i%PAL.length]);const tot=parts.reduce((a,p)=>a+p.v,0);
 $('sxDonut').innerHTML=donut(parts,tot);$('sxDonutSub').textContent=ym;
 $('sxLeg').innerHTML=parts.length?parts.map(p=>`<div><i style="background:${p.c}"></i>${esc(p.name)}<b>${fmt(p.v)}</b><span>${fmt(p.v/tot*100)}%</span></div>`).join(''):'<div class="sx-sub">Sin ventas en el período.</div>';
}
function initials(s){const p=String(s).trim().split(/\s+/);return((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase()}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function decorate(){
 document.querySelectorAll('#sellerBars .seller-table tbody td:first-child,#salesPaceTable tbody td:first-child,#sellersTable tbody td:first-child').forEach(td=>{
  if(td.dataset.sx||td.colSpan>1)return;const name=(td.querySelector('.seller-name')?td.querySelector('.seller-name').textContent:td.textContent).trim();if(!name)return;td.dataset.sx='1';
  const h=hue(name),wrap=document.createElement('div'),av=document.createElement('span'),tx=document.createElement('div');wrap.className='sx-who';av.className='sx-av';av.textContent=initials(name);av.style.background=`hsl(${h} 70% 91%)`;av.style.color=`hsl(${h} 55% 32%)`;
  while(td.firstChild)tx.appendChild(td.firstChild);wrap.appendChild(av);wrap.appendChild(tx);td.appendChild(wrap);
 });
}
let queued=false;const run=()=>{queued=false;draw();decorate()};const schedule=()=>{if(!queued){queued=true;requestAnimationFrame(run)}};
function start(){
 run();const obs=new MutationObserver(schedule);
 ['fActual','fGoal','sellerBars','salesPaceTable','sellersTable','periodLabel'].map($).filter(Boolean).forEach(t=>obs.observe(t,{childList:true,subtree:true,characterData:true}));
 const p=$('dashboardPeriod');if(p)p.addEventListener('change',schedule);window.addEventListener('storage',schedule);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,0));else setTimeout(start,0);
})();
</script>
